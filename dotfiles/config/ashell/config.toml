# Ashell Configuration
# https://malpenzibo.github.io/ashell/docs/configuration

# Log level: trace, debug, info, warn, error
log_level = "warn"

# Output configuration - empty means all outputs
# outputs = { Targets = ["eDP-1"] }

# Bar position: Top or Bottom
position = "Top"

# App launcher command (using rofi to match current setup)
app_launcher_cmd = "rofi -show drun"

[modules]
left = [
    ["appLauncher", "Updates"],
    "WindowTitle",
    "MediaPlayer"
]
center = [
  "Clock", 
  "Workspaces",
]
right = [
    "SystemInfo",
    "Volume",
    ["Tray", "Privacy", "Settings"]
]

[system_info]
indicators = [ "Cpu", "Memory", "DownloadSpeed", "UploadSpeed" ]

[system_info.cpu]
warn_threshold = 60
alert_threshold = 80

[system_info.memory]
warn_threshold = 70
alert_threshold = 85

[system_info.disk]
warn_threshold = 80
alert_threshold = 90


[updates]
# Check for updates using checkupdates (Arch)
check_cmd = "checkupdates"
# Update command using alacritty
update_cmd = 'alacritty -e bash -c "sudo pacman -Syu; echo Done - Press enter to exit; read" &'

[workspaces]
# Enable automatic workspace filling
enable_workspace_filling = true

[[CustomModule]]
name = "appLauncher"
icon = "󱗼"
command = "hyprlauncher"

[[CustomModule]]
name = "Volume"
icon = ""
command = "pavucontrol"
listen_cmd = "bash -lc 'cd ~/.config/ashell && ./ashell-volume-status.sh'"
icons.'muted' = "🔇"
icons.'low' = "🔈"
icons.'medium' = "🔉"
icons.'high' = "🔊"

[window_title]
# Truncate window title after this many characters
truncate_title_after_length = 100

[settings]
# Lock screen command using hyprlock
lock_cmd = "hyprlock"
# Audio control commands
audio_sinks_more_cmd = "pavucontrol -t 3"
audio_sources_more_cmd = "pavucontrol -t 4"
# Network settings
wifi_more_cmd = "nm-connection-editor"
vpn_more_cmd = "nm-connection-editor"
# Bluetooth settings
bluetooth_more_cmd = "blueberry"

[appearance]
# Font configuration
font_name = "FiraCode Nerd Font"
scale_factor = 1.0

# Style: Regular, Solid, Islands
style = "Solid"

success_color = "#a6e3a1"
text_color = "#cdd6f4"

workspace_colors = [ "#fab387", "#b4befe", "#cba6f7" ]

[appearance.primary_color]
base = "#fab387"
text = "#1e1e2e"

[appearance.danger_color]
base = "#f38ba8"
weak = "#f9e2af"

[appearance.background_color]
base = "#1e1e2e"
weak = "#313244"
strong = "#45475a"

[appearance.secondary_color]
base = "#11111b"
strong = "#1b1b25"
