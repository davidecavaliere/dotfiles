<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!--
    Fix: color emoji (🔥 🔧 🛑 ✅ …) rendered as tofu in Alacritty.

    Cause: "Font Awesome" and the Nerd Fonts declare coverage of standard
    emoji Unicode codepoints, and fontconfig ranked them ahead of
    Noto Color Emoji. Alacritty picks fontconfig's first match for each
    glyph, landed on Font Awesome, which has no real glyph there -> tofu.

    These rules make Noto Color Emoji the preferred fallback for emoji,
    tried right after the requested family and ahead of Font Awesome /
    Nerd Fonts. Nerd Font PUA icons still come from the primary font
    because Noto Color Emoji is only consulted for glyphs the primary
    font lacks.
  -->

  <!-- The 'emoji' generic family must resolve to the color font. -->
  <alias binding="strong">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- Prefer color emoji over other fallbacks for the standard generics. -->
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>

  <!-- For the explicit terminal families, append Noto Color Emoji so it is
       consulted before the generic (Font Awesome / Nerd) fallbacks. -->
  <match target="pattern">
    <test name="family"><string>FiraCode Nerd Font</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
  <match target="pattern">
    <test name="family"><string>FiraCode Nerd Font Mono</string></test>
    <edit name="family" mode="append" binding="strong"><string>Noto Color Emoji</string></edit>
  </match>
</fontconfig>
