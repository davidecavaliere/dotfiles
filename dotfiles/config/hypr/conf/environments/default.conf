# -----------------------------------------------------
# Environment Variables
# name: "Default"
# -----------------------------------------------------

# Default Settings in ml4w.conf

# fcitx5 input method (Japanese via mozc). Classic IM-module vars cover
# XWayland/Electron/Qt apps; native Wayland apps use text-input-v3 directly.
env = GTK_IM_MODULE,fcitx
env = QT_IM_MODULE,fcitx
env = XMODIFIERS,@im=fcitx
