# -----------------------------------------------------
# General window layout and colors
# name: "Default"
# -----------------------------------------------------

general {
    gaps_in = 10
    gaps_out = 9
    border_size = 4
    col.active_border = $mauve
    col.inactive_border = $on_primary
    layout = dwindle
    resize_on_border = true
}

group {
    col.border_active = $mauve
    col.border_inactive = $surface2
    col.border_locked_active = $mauve
    col.border_locked_inactive = $surface2

    groupbar {
        render_titles = true
        col.active = $mauve
        col.inactive = $surface2
        col.locked_active = $mauve
        col.locked_inactive = $surface2
        text_color = $mauve
        text_color_inactive = $surface2
        indicator_gap = 4
        indicator_height = 0
        font_size = 10
    }
}

